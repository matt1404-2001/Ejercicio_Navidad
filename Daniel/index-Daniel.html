
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Tarjetas - APSW</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/Targeta1.css">
    <link rel="stylesheet" href="css/Targeta2.css">
    <link rel="stylesheet" href="css/Targeta3.css">

</head>

<body>

    <h1>Mis Tarjetas</h1>

    <div class="contenedor-tarjetas">

        <section class="tarjeta-uno">

            <h2>Tarjeta 1</h2>

            <div class="card-container">
                <div class="card">

                    <div class="front">
                        APSW
                    </div>

                </div>
            </div>

        </section>

        <section class="tarjeta-dos">

            <h2>Tarjeta 2</h2>

            <div class="contenedor">

                <div class="contenedor_tarjeta">

                    <figure>

                        <img
                            class="frontal"
                            src="imagen/tarjeta.jpg"
                            alt="Imagen de la tarjeta">

                        <figcaption class="trasera">

                            <h2 class="titulo">
                                Colegio Universitario de Cartago
                            </h2>

                            <hr>

                            <p>
                                Administración y Programación
                                de Sitios Web
                            </p>

                        </figcaption>

                    </figure>

                </div>

            </div>

        </section>

        <section class="tarjeta-tres">

            <h2>Tarjeta 3</h2>

            <div class="container">

                <div class="card">

                    <div class="front">

                        <div class="logo">
                            <span></span>
                        </div>

                    </div>

                    <div class="back">

                        <h1>
                            Colegio Universitario de Cartago
                            <span>CUC</span>
                        </h1>

                        <ul>
                            <li>+506-1111-1111</li>
                            <li>correo@ejemplo.com</li>
                            <li>www.cuc.ac.cr</li>
                        </ul>

                    </div>

                </div>

            </div>

        </section>

    </div>

</body>
</html>
